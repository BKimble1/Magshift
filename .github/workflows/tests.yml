name: Checks and Simulator tests

# Manual only, and callable by the release workflow. There is deliberately no
# push or pull_request trigger: this project's CI is started by a person, so a
# build never runs against a half-finished branch.
#
# It signs nothing, publishes nothing and needs no Apple account. It is the only
# thing that proves the Swift compiles and the tests pass, so run it and get it
# green before ever starting a release.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label. Needs Xcode 26.4+ with the iOS 26 SDK.'
        required: false
        default: 'macos-latest'
        type: string
  workflow_call:
    inputs:
      runner:
        description: 'macOS runner label. Needs Xcode 26.4+ with the iOS 26 SDK.'
        required: false
        default: 'macos-latest'
        type: string

permissions:
  contents: read

defaults:
  run:
    # `pipefail` matters: every xcodebuild invocation is piped into `tee`, and
    # without it a failing build would be reported as a passing step.
    shell: bash -euo pipefail {0}

env:
  XCODE_PROJECT: WallField.xcodeproj
  XCODE_SCHEME: WallField
  MINIMUM_XCODE_VERSION: '26.4'
  MINIMUM_IOS_SDK_VERSION: '26.0'

jobs:
  test:
    name: Repository checks, compile and full test suite
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the Xcode toolchain
        run: |
          # A runner image ships several Xcodes and points `xcode-select` at
          # whichever one its maintainers chose. Discover the newest that meets
          # the floor and export DEVELOPER_DIR, which overrides that choice for
          # every later step without needing sudo.
          selection="$(python3 Tools/select_xcode.py --minimum "$MINIMUM_XCODE_VERSION")"
          echo "$selection"
          echo "$selection" >> "$GITHUB_ENV"

      - name: Verify the toolchain and iOS SDK
        run: |
          echo "--- Build machine ---"
          sw_vers
          xcodebuild -version
          echo
          echo "--- Installed SDKs ---"
          xcodebuild -showsdks
          echo

          # `-sdk iphonesimulator26.0` cannot match this pattern, so only device
          # SDKs are considered.
          ios_sdk_version="$(xcodebuild -showsdks \
            | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' \
            | python3 -c 'import sys; v=[l.strip() for l in sys.stdin if l.strip()]; k=lambda s: tuple(int(x) for x in s.split(".") if x.isdigit()); print(max(v, key=k) if v else "")')"

          if [ -z "$ios_sdk_version" ]; then
            echo "::error::no iOS SDK is installed on this runner."
            exit 1
          fi

          # Apple requires apps uploaded since 28 April 2026 to be built with
          # the iOS 26 SDK or later. Catching that here costs seconds; catching
          # it at upload costs a whole build.
          if ! python3 -c 'import sys; p = lambda v: tuple(int(x) for x in v.split(".") if x.isdigit()); sys.exit(0 if p(sys.argv[1]) >= p(sys.argv[2]) else 1)' \
              "$ios_sdk_version" "$MINIMUM_IOS_SDK_VERSION"; then
            echo "::error::the newest installed iOS SDK is $ios_sdk_version, but App Store uploads require at least $MINIMUM_IOS_SDK_VERSION. Re-run with a newer 'runner' label."
            exit 1
          fi

          echo "Xcode $XCODE_VERSION with iOS SDK $ios_sdk_version. Both meet the minimum."

      - name: Repository checks
        run: |
          # Tools/validate_codemagic.py parses YAML, which needs PyYAML. The
          # ladder covers a runner Python that is externally managed (PEP 668).
          if ! python3 -c 'import yaml' > /dev/null 2>&1; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml \
              || python3 -m pip install --quiet --disable-pip-version-check --user pyyaml \
              || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyyaml
          fi

          # Project reference integrity, Swift source rules, symbol references,
          # prohibited and guarded wording, the detection arithmetic, and both
          # CI configurations against what is actually in the repository.
          Tools/check_all.sh

      - name: Select an available iOS Simulator
        run: |
          mkdir -p build/logs

          echo "--- Installed simulator runtimes ---"
          xcrun simctl list runtimes | tee build/logs/simctl-runtimes.log
          echo

          # The destination is discovered, never hard-coded: a pinned device
          # name breaks every time the runner image changes.
          xcrun simctl list devices available --json > build/logs/simctl-devices.json
          selection="$(python3 Tools/select_simulator.py build/logs/simctl-devices.json)"
          echo "$selection"
          echo "$selection" >> "$GITHUB_ENV"

          udid="$(printf '%s\n' "$selection" | sed -n 's/^SIMULATOR_UDID=//p')"

          # Boot ahead of xcodebuild and wait for it. A cold boot inside the
          # test action is a common source of first-launch flake in UI tests.
          xcrun simctl bootstatus "$udid" -b

          # Disconnecting the hardware keyboard makes the software keyboard
          # appear for XCUITest text entry, which is what the review-screen UI
          # test types into. Best effort: it is a preference, not an API.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

      - name: Compile the app for the Simulator
        run: |
          mkdir -p build/logs
          # The WallField scheme's build action contains the app target only, so
          # this step proves the application itself compiles, separately from
          # the test bundles. A failure here is unambiguously an app failure.
          NSUnbufferedIO=YES xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/logs/build-app.log

      - name: Build the test bundles
        run: |
          mkdir -p build/logs
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/logs/build-for-testing.log

      - name: Run unit and UI tests
        run: |
          mkdir -p build/logs
          rm -rf build/test-results

          # Runs every test in the scheme: WallFieldTests and WallFieldUITests.
          #
          # The UI tests drive the app in its deterministic simulated mode by
          # passing -WallFieldDemoMode and -WallFieldResetState as launch
          # arguments from the test code itself, so no separate scheme is needed
          # and the mode cannot be lost by editing CI configuration.
          #
          # Parallel testing is disabled on purpose: these tests assert on
          # deterministic sensor data, and determinism is worth more here than
          # wall-clock time.
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/test-results/WallField.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/logs/tests.log

      - name: Upload test results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wallfield-test-results-${{ github.run_number }}
          path: |
            build/test-results/**
            build/logs/**
          retention-days: 14
          if-no-files-found: warn
