# Codemagic CI for WallField (Idlery Services LLC)
#
# Two workflows, both started by hand from the Codemagic UI or API. Neither has
# a `triggering:` block, which is how Codemagic expresses "manual only" -- there
# is no branch or tag pattern that can start either of these builds.
#
#   wallfield-simulator-tests   checks + compile + full test suite. Publishes nothing.
#   wallfield-testflight        checks + tests + signed App Store IPA -> TestFlight.
#
# ---------------------------------------------------------------------------
# BEFORE THE FIRST TESTFLIGHT RUN, one value below must match your Codemagic
# account. In `wallfield-testflight`:
#
#     integrations:
#       app_store_connect: WallField App Store Connect
#
# must be the exact name of the App Store Connect integration in
# Codemagic -> Teams/Personal account -> Integrations -> App Store Connect.
# Codemagic fails the build immediately, before any script runs, if the name
# does not resolve, so a mismatch is loud rather than mysterious.
#
# Optional: set APP_STORE_APPLE_ID (the app's numeric Apple ID from App Store
# Connect) as an environment variable to have the build number derived from
# what App Store Connect already holds. Without it the build still gets a
# unique, increasing number -- see "Choose a build number" below.
# ---------------------------------------------------------------------------

definitions:
  scripts:
    - &verify_toolchain
      name: Verify the Xcode toolchain and iOS SDK
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"

        echo "--- Build machine ---"
        sw_vers
        xcodebuild -version
        echo
        echo "--- Installed SDKs ---"
        xcodebuild -showsdks
        echo

        xcode_version="$(xcodebuild -version | head -n 1 | awk '{ print $2 }')"
        # `-sdk iphonesimulator26.0` cannot match this pattern, so only device
        # SDKs are considered.
        ios_sdk_version="$(xcodebuild -showsdks \
          | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' \
          | python3 -c 'import sys; v=[l.strip() for l in sys.stdin if l.strip()]; k=lambda s: tuple(int(x) for x in s.split(".") if x.isdigit()); print(max(v, key=k) if v else "")')"

        # Compared numerically rather than with `sort -V`, so the guard cannot
        # itself become the reason a build fails.
        at_least() {
          python3 -c 'import sys; p = lambda v: tuple(int(x) for x in v.split(".") if x.isdigit()); sys.exit(0 if p(sys.argv[1]) >= p(sys.argv[2]) else 1)' "$1" "$2"
        }

        if ! at_least "$xcode_version" "$MINIMUM_XCODE_VERSION"; then
          echo "ERROR: Xcode $xcode_version is older than the required $MINIMUM_XCODE_VERSION." >&2
          echo "Set 'xcode:' in codemagic.yaml to a version Codemagic offers that is at least" >&2
          echo "$MINIMUM_XCODE_VERSION, or to 'latest'. This guard enforces the floor either way." >&2
          exit 1
        fi

        if [ -z "$ios_sdk_version" ]; then
          echo "ERROR: no iOS SDK is installed on this machine." >&2
          exit 1
        fi

        # Apple requires apps uploaded since 28 April 2026 to be built with the
        # iOS 26 SDK or later. Catching that here costs seconds; catching it at
        # upload costs a whole build.
        if ! at_least "$ios_sdk_version" "$MINIMUM_IOS_SDK_VERSION"; then
          echo "ERROR: the newest installed iOS SDK is $ios_sdk_version, but App Store" >&2
          echo "uploads require at least $MINIMUM_IOS_SDK_VERSION." >&2
          exit 1
        fi

        echo "Xcode $xcode_version with iOS SDK $ios_sdk_version. Both meet the minimum."

    - &repository_checks
      name: Repository checks
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"

        # Tools/validate_codemagic.py parses this file, which needs PyYAML.
        if ! python3 -c 'import yaml' > /dev/null 2>&1; then
          echo "Installing PyYAML for the CI configuration check..."
          python3 -m pip install --quiet --disable-pip-version-check pyyaml \
            || python3 -m pip install --quiet --disable-pip-version-check --user pyyaml
        fi

        # Project reference integrity, Swift source rules, symbol references,
        # prohibited and guarded wording, the detection arithmetic, the
        # simulator picker's self-test, and this file's own consistency with
        # the Xcode project.
        Tools/check_all.sh

    - &select_simulator
      name: Select an available iOS Simulator
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        mkdir -p build/logs

        echo "--- Installed simulator runtimes ---"
        xcrun simctl list runtimes | tee build/logs/simctl-runtimes.log
        echo

        # The destination is discovered, never hard-coded: a pinned device name
        # breaks every time the runner image changes.
        xcrun simctl list devices available --json > build/logs/simctl-devices.json
        selection="$(python3 Tools/select_simulator.py build/logs/simctl-devices.json)"
        echo "$selection"
        echo "$selection" >> "$CM_ENV"

        udid="$(printf '%s\n' "$selection" | sed -n 's/^SIMULATOR_UDID=//p')"

        # Boot ahead of xcodebuild and wait for it. A cold boot inside the test
        # action is a common source of first-launch flake in UI tests.
        xcrun simctl bootstatus "$udid" -b

        # Disconnecting the hardware keyboard makes the software keyboard appear
        # for XCUITest text entry, which is what the review-screen UI test types
        # into. Best effort: it is a preference, not an API.
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

    - &build_app
      name: Compile the app for the Simulator
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        mkdir -p build/logs

        # The WallField scheme's build action contains the app target only, so
        # this step proves the application itself compiles, separately from the
        # test bundles. A failure here is unambiguously an app failure.
        NSUnbufferedIO=YES xcodebuild build \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -configuration Debug \
          -destination "id=$SIMULATOR_UDID" \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tee build/logs/build-app.log

    - &build_for_testing
      name: Build the test bundles
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        mkdir -p build/logs

        NSUnbufferedIO=YES xcodebuild build-for-testing \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -configuration Debug \
          -destination "id=$SIMULATOR_UDID" \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tee build/logs/build-for-testing.log

    - &run_tests
      name: Run unit and UI tests
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$CM_BUILD_DIR"
        mkdir -p build/logs
        rm -rf build/test-results

        # Runs every test in the scheme: WallFieldTests and WallFieldUITests.
        #
        # The UI tests drive the app in its deterministic simulated mode by
        # passing -WallFieldDemoMode and -WallFieldResetState as launch
        # arguments from the test code itself, so no separate scheme is needed
        # and the mode cannot be lost by editing CI configuration. The tests are
        # built Debug, which is the only configuration in which simulated data
        # is compiled in at all.
        #
        # Parallel testing is disabled on purpose: these tests assert on
        # deterministic sensor data, and determinism is worth more here than
        # wall-clock time.
        NSUnbufferedIO=YES xcodebuild test-without-building \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -configuration Debug \
          -destination "id=$SIMULATOR_UDID" \
          -derivedDataPath build/DerivedData \
          -resultBundlePath build/test-results/WallField.xcresult \
          -parallel-testing-enabled NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tee build/logs/tests.log
      test_report: build/test-results/*.xcresult

workflows:

  # ---------------------------------------------------------------------------
  # Verification only. Signs nothing, uploads nothing, needs no Apple account.
  # ---------------------------------------------------------------------------
  wallfield-simulator-tests:
    name: WallField - repository checks and Simulator tests
    instance_type: mac_mini_m2
    max_build_duration: 60

    # No `triggering:` block, so this workflow only ever starts by hand.

    environment:
      # Pinned for reproducibility. `latest` also works: the first script fails
      # the build if the selected Xcode is below MINIMUM_XCODE_VERSION.
      xcode: "26.4"
      vars:
        XCODE_PROJECT: "WallField.xcodeproj"
        XCODE_SCHEME: "WallField"
        MINIMUM_XCODE_VERSION: "26.4"
        MINIMUM_IOS_SDK_VERSION: "26.0"

    # No caching. The project has no third-party dependencies, so there is
    # nothing meaningful to cache, and a cached DerivedData tree would risk a
    # stale build masking a real compile failure.

    scripts:
      - *verify_toolchain
      - *repository_checks
      - *select_simulator
      - *build_app
      - *build_for_testing
      - *run_tests

    artifacts:
      - build/test-results/*.xcresult
      - build/logs/*.log
      - build/logs/*.json

    # Deliberately no `publishing:` section. This workflow reports; it ships
    # nothing.

  # ---------------------------------------------------------------------------
  # Signed App Store build, uploaded to App Store Connect and TestFlight.
  # ---------------------------------------------------------------------------
  wallfield-testflight:
    name: WallField - TestFlight release
    instance_type: mac_mini_m2
    max_build_duration: 120

    # No `triggering:` block: releases are started by hand, never by a push.

    # Must match the App Store Connect integration name in your Codemagic
    # account. See the header of this file.
    integrations:
      app_store_connect: WallField App Store Connect

    environment:
      xcode: "26.4"

      # Automatic App Store signing. Codemagic uses the integration above to
      # fetch (creating if necessary) the distribution certificate and an App
      # Store provisioning profile for this bundle identifier, before any script
      # runs. `xcode-project use-profiles` then applies them to the project.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.idlery.magshift

      vars:
        XCODE_PROJECT: "WallField.xcodeproj"
        XCODE_SCHEME: "WallField"
        BUNDLE_ID: "com.idlery.magshift"
        MINIMUM_XCODE_VERSION: "26.4"
        MINIMUM_IOS_SDK_VERSION: "26.0"

    scripts:
      - *verify_toolchain
      - *repository_checks
      - *select_simulator
      - *build_app
      - *build_for_testing
      - *run_tests

      - name: Choose a build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # $BUILD_NUMBER is Codemagic's own per-workflow counter: unique and
          # strictly increasing on its own, which is enough for a first upload.
          candidate="${BUILD_NUMBER:?Codemagic did not provide BUILD_NUMBER}"

          # When the app already exists in App Store Connect, stay ahead of what
          # is there -- including builds uploaded from outside Codemagic.
          # Failures here are not fatal: the counter above is already valid.
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            for query in get-latest-testflight-build-number get-latest-app-store-build-number; do
              latest="$(app-store-connect "$query" "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null \
                | grep -oE '^[0-9]+$' | tail -n 1 || true)"
              if [ -n "$latest" ] && [ "$((latest + 1))" -gt "$candidate" ]; then
                candidate="$((latest + 1))"
              fi
              echo "App Store Connect $query: ${latest:-unavailable}"
            done
          else
            echo "APP_STORE_APPLE_ID is not set; using the Codemagic build counter alone."
          fi

          echo "WALLFIELD_BUILD_NUMBER=$candidate" >> "$CM_ENV"
          echo "Build number for this archive: $candidate"

      - name: Apply the fetched signing profiles
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Verify the export options
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          export_options="$HOME/export_options.plist"
          if [ ! -f "$export_options" ]; then
            echo "ERROR: no export options plist was generated at $export_options." >&2
            echo "Check that the App Store Connect integration and ios_signing block resolved." >&2
            exit 1
          fi

          echo "--- Export options ---"
          plutil -p "$export_options"
          echo

          # This build must stay eligible for App Store submission, so the
          # internal-testing-only export must never be set. Nothing in this file
          # enables it; this asserts that nothing else did either.
          if /usr/libexec/PlistBuddy -c "Print :testFlightInternalTestingOnly" \
              "$export_options" >/dev/null 2>&1; then
            echo "ERROR: testFlightInternalTestingOnly is present in the export options." >&2
            echo "That produces a build which can never be submitted to the App Store." >&2
            exit 1
          fi

          method="$(/usr/libexec/PlistBuddy -c "Print :method" "$export_options")"
          case "$method" in
            app-store|app-store-connect)
              echo "Export method: $method" ;;
            *)
              echo "ERROR: export method is '$method'; expected a normal App Store export." >&2
              exit 1 ;;
          esac

      - name: Archive and export the App Store IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # CURRENT_PROJECT_VERSION is passed on the command line, which has the
          # highest precedence in Xcode's build-setting hierarchy, so it
          # overrides Config/Shared.xcconfig without the CI mutating the
          # repository. Info.plist maps CFBundleVersion to it.
          #
          # No --custom-export-options: the export options generated by
          # use-profiles are used as-is, which is a normal App Store export.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$WALLFIELD_BUILD_NUMBER"

      - name: Verify the IPA before uploading
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # `|| true` so a missing directory reports the message below rather
          # than aborting on `find`'s exit status under `set -euo pipefail`.
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' 2>/dev/null | head -n 1 || true)"
          if [ -z "$ipa" ]; then
            echo "ERROR: no IPA was produced. Check the archive step above." >&2
            exit 1
          fi
          echo "IPA: $ipa"

          rm -rf build/verify && mkdir -p build/verify
          unzip -o -j "$ipa" 'Payload/*.app/Info.plist' -d build/verify > /dev/null
          plutil -convert xml1 build/verify/Info.plist
          echo "--- Shipped Info.plist ---"
          plutil -p build/verify/Info.plist
          echo

          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" build/verify/Info.plist; }

          built_bundle_id="$(read_key CFBundleIdentifier)"
          built_version="$(read_key CFBundleVersion)"
          built_short_version="$(read_key CFBundleShortVersionString)"

          if [ "$built_bundle_id" != "$BUNDLE_ID" ]; then
            echo "ERROR: built bundle id is $built_bundle_id, expected $BUNDLE_ID." >&2
            exit 1
          fi
          if [ "$built_version" != "$WALLFIELD_BUILD_NUMBER" ]; then
            echo "ERROR: built CFBundleVersion is $built_version, expected $WALLFIELD_BUILD_NUMBER." >&2
            exit 1
          fi

          # WallField uses no encryption of any kind, so this key is declared
          # false in Config/WallField-Info.plist. Asserting it reached the
          # shipped binary avoids the compliance question stalling every
          # TestFlight build.
          if ! encryption="$(read_key ITSAppUsesNonExemptEncryption 2>/dev/null)"; then
            echo "ERROR: ITSAppUsesNonExemptEncryption is missing from the shipped Info.plist." >&2
            exit 1
          fi
          if [ "$encryption" != "false" ]; then
            echo "ERROR: ITSAppUsesNonExemptEncryption is '$encryption', expected false." >&2
            exit 1
          fi

          echo "Verified $built_bundle_id $built_short_version ($built_version), export compliance declared."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**/*.dSYM
      - build/test-results/*.xcresult
      - build/logs/*.log
      - build/logs/*.json
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        # Upload the build and make it available in TestFlight. This is an
        # ordinary App Store build, so the same upload stays eligible for App
        # Store submission later.
        submit_to_testflight: true

        # Submitting to App Store review is a deliberate, separate decision, and
        # Docs/VALIDATION_PROTOCOL.md has to be completed first.
        submit_to_app_store: false
